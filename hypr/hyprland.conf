# Hyprland Configuration

# ==================
# MONITOR CONFIG
# ==================

monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
monitor = DP-1, 1920x1080@240, 1920x0, 1
monitor = HDMI-A-2, 1920x1080@75, 3840x0, 1

workspace=1,monitor:HDMI-A-1
workspace=2,monitor:HDMI-A-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:DP-1
workspace=5,monitor:DP-1
workspace=6,monitor:DP-1
workspace=7,monitor:DP-1
workspace=8,monitor:HDMI-A-2
workspace=9,monitor:HDMI-A-2
workspace=10,monitor:HDMI-A-2

# ==================
# ENVIRONMENT VARS
# ==================
env = GDK_BACKEND,wayland,x11
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3

# ==================
# NVIDIA CONFIG
# ==================
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_DRM_NO_ATOMIC,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NVD_BACKEND,direct

# ==================
# STARTUP APPS
# ==================
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = dms run
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = udiskie --no-automount --smart-tray

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0  # off in niri

    col.active_border = rgba(707070ff)
    col.inactive_border = rgba(d0d0d0ff)

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 0.95
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# ==================
# WINDOW RULES
# ==================

# === Opacity ===
windowrule = opacity 0.92 0.90, match:class ^(Cursor|cursor)$
windowrule = opacity 0.92 0.90, match:class ^(code)$
windowrule = opacity 0.90 0.85, match:class ^(Spotify)$
windowrule = opacity 0.90 0.85, match:class ^(kitty)$


# === Float Or Tiled Windows ===
windowrule = float on, size 1200 600, center on, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = float on, size 350 550, center on, match:class ^(gnome-calculator)$
windowrule = float on, size 500 600, center on, match:class ^(blueman-manager)$
windowrule = float on, size 1200 600, center on, match:class ^(xdg-desktop-portal|xdg-desktop-portal-gtk)$
windowrule = float on, size 850 500, center on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, size 950 900, center on, match:class ^(org\.quickshell)$

layerrule = no_anim on, match:namespace ^(quickshell)$

# ==================
# KEYBINDINGS
# ==================
$mod = SUPER
$term = kitty
$file = nautilus
$browser = chromium
$editor = cursor
$music = spotify-launcher
$pass = 1password


# Dank Material Shell Applications
bind = $mod SHIFT, R, exec, dms ipc call spotlight toggle
bind = $mod, V, exec, dms ipc call clipboard toggle
bind = CTRL SHIFT, escape, exec, dms ipc call processlist toggle
bind = CTRL ALT, Delete, exec, dms ipc call processlist toggle
bind = $mod, COMMA, exec, dms ipc call settings toggle
bind = $mod SHIFT, N, exec, dms ipc call notifications toggle
bind = $mod SHIFT, S, exec, dms ipc call notepad toggle
bind = $mod, Y, exec, dms ipc call dankdash wallpaper
bind = $mod, TAB, exec, dms ipc call hypr toggleOverview
bind = $mod, R, exec, killall dms; dms run &

# === Application Launchers ===
bind = $mod, return, exec, $term
bind = $mod, N, exec, $file
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $editor
bind = $mod, M, exec, hyprctl dispatch focuswindow "class:^(Spotify)$" && spotify-launcher
 
# === Cheat sheet
bind = $mod, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = $mod, L, exec, dms ipc call lock lock

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 1
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 1
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = $mod, XF86AudioMute, exec, dms ipc call audio cycleoutput
bind = $mod, bracketright, exec, playerctl --player=spotify next
bind = $mod, bracketleft, exec, playerctl --player=spotify previous
bind = $mod, backslash, exec, ~/.config/hypr/scripts/play-pause.sh
bindel = CTRL, XF86AudioRaiseVolume, exec, playerctl position 5+
bindel = CTRL, XF86AudioLowerVolume, exec, playerctl position 5-


# === Window Management ===
bind = $mod, C, killactive
bind = $mod, J, togglesplit
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, space, togglefloating

# === Focus Navigation ===
bind = CTRL SHIFT, W, movefocus, u
bind = CTRL SHIFT, A, movefocus, l
bind = CTRL SHIFT, S, movefocus, d
bind = CTRL SHIFT, D, movefocus, r

# === Window Movement ===
bind = $mod, W, movewindow, u
bind = $mod, A, movewindow, l
bind = $mod, S, movewindow, d
bind = $mod, D, movewindow, r

# === Window Resizing ===
binde = $mod SHIFT, W, resizeactive, 0 -10%
binde = $mod SHIFT, A, resizeactive, -10% 0
binde = $mod SHIFT, S, resizeactive, 0 10%
binde = $mod SHIFT, D, resizeactive, 10% 0

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# === Screenshots ===
bind = $mod, NEXT, exec, grimblast copysave output ~/Media/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png && notify-send --app-name="Screenshots" "Screenshot Copied and Saved" "Saved as: screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"
bind = , NEXT, exec, grimblast copy output && notify-send --app-name="Screenshots" "Screenshot Copied to Clipboard"

source = ./dms/outputs.conf
